{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static "update_author.css" %}">
</head>
<body>
    <div class="container">
        <h1>Изменить автора</h1>
 
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="full_name" value="{{ author.full_name }}" placeholder="ФИО автора" required>
            <input type="number" name="age" value="{{ author.age }}" placeholder="Возраст" min="0" required>
            <button type="submit">Сохранить</button>
        </form>
 
        <a class="back" href="{% url 'show_authors' %}">← К списку авторов</a>
    </div>
</body>
</html>
